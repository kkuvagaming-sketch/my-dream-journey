<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriber Booster - Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  max-width: 450px;
  margin: auto;
  padding: 25px 18px;
}

.card {
  background: #1f2937;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 15px 0 7px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #ef4444;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  opacity: .6;
}

.progress-box {
  margin-top: 25px;
  display: none;
}

.progress {
  width: 100%;
  height: 15px;
  background: #374151;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 0%;
  height: 100%;
  background: #22c55e;
  transition: width .2s;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

.demo {
  margin-top: 25px;
  padding: 12px;
  background: #422006;
  color: #fbbf24;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🚀 Subscriber Booster</h1>

    <div class="subtitle">
      YouTube Promotion Dashboard
    </div>

    <label>YouTube Channel / Video Link</label>
    <input
      id="youtubeLink"
      type="url"
      placeholder="https://youtube.com/..."
    >

    <label>Subscriber Target</label>
    <select id="target">
      <option value="100">100 Subscribers</option>
      <option value="500">500 Subscribers</option>
      <option value="1000">1,000 Subscribers</option>
    </select>

    <button id="startBtn" onclick="startDemo()">
      Start Demo
    </button>

    <div class="progress-box" id="progressBox">

      <div class="stats">
        <span>Progress</span>
        <strong id="count">0 / 1000</strong>
      </div>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>

      <p id="status">Demo शुरू हो रहा है...</p>

    </div>

    <div class="demo">
      ⚠️ DEMO ONLY — कोई वास्तविक YouTube subscriber नहीं जोड़ा जाता।
    </div>

  </div>
</div>

<script>

function startDemo() {

  const link = document.getElementById("youtubeLink").value.trim();
  const target = Number(document.getElementById("target").value);

  if (!link) {
    alert("पहले YouTube लिंक डालें!");
    return;
  }

  const button = document.getElementById("startBtn");
  const box = document.getElementById("progressBox");
  const bar = document.getElementById("bar");
  const count = document.getElementById("count");
  const status = document.getElementById("status");

  button.disabled = true;
  box.style.display = "block";

  let current = 0;

  const timer = setInterval(() => {

    current += Math.ceil(target / 100);

    if (current >= target) {
      current = target;
      clearInterval(timer);

      status.innerText =
        "✅ Demo पूरा हुआ — यह केवल simulated result है।";

      button.disabled = false;
      button.innerText = "Run Demo Again";
    } else {
      status.innerText =
        "⏳ Demo progress चल रहा है...";
    }

    const percentage = (current / target) * 100;

    bar.style.width = percentage + "%";
    count.innerText =
      current.toLocaleString() +
      " / " +
      target.toLocaleString();

  }, 100);

}

</script>

</body>
</html>
