<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Bikes 3D - Open World</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* --- मेनू स्क्रीन (Main Menu Style) --- */
        #mainMenu {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111, #1a1a2e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .menu-title {
            font-size: 28px;
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .menu-btn {
            width: 220px;
            padding: 14px;
            margin: 8px 0;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            color: #222;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #e0e0e0;
        }

        /* --- गेम प्ले स्क्रीन --- */
        #gameScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            background: linear-gradient(to bottom, #4a90e2 60%, #333 40%);
            overflow: hidden;
        }

        /* 3D शहर का रास्ता और माहौल */
        .world-3d {
            position: absolute;
            width: 300%;
            height: 100%;
            display: flex;
            transition: transform 0.1s linear;
        }
        .road-strip {
            width: 100%;
            height: 100%;
            position: relative;
            background: #2c3e50;
        }
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45%;
            background: #1a1a1a;
            border-top: 6px solid #7f8c8d;
        }
        .road-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(90deg, #f1c40f, #f1c40f 40px, transparent 40px, transparent 80px);
            transform: translateY(-50%);
        }

        /* कैरेक्टर और वाहन */
        #player {
            position: absolute;
            bottom: 15vh;
            left: 30%;
            font-size: 65px;
            z-index: 10;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.6));
        }
        #vehicle {
            position: absolute;
            bottom: 15vh;
            left: 42%;
            font-size: 75px;
            z-index: 10;
            transition: transform 0.3s;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.6));
        }

        /* गेम के अंदर के कंट्रोल्स (Buttons & UI) */
        .ui-top-right {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }
        .hud-btn {
            width: 45px;
            height: 45px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* चीट कोड बॉक्स (नीचे बीच में) */
        .cheat-box {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 30px;
            z-index: 20;
            border: 1px solid #555;
        }
        .cheat-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            width: 120px;
            text-align: center;
            outline: none;
        }
        .cheat-box button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* मूविंग कंट्रोल्स (Left & Right arrows) */
        .move-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .dir-btn {
            width: 55px;
            height: 55px;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 24px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        #msgDisplay {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #2ecc71;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- मेनू स्क्रीन -->
    <div id="mainMenu">
        <div class="menu-title">🇮🇳 Indian Bikes 3D</div>
        <button class="menu-btn" onclick="startGame()">Play</button>
        <button class="menu-btn" onclick="alert('Setting: Graphics High, Controls Normal')">Setting</button>
        <button class="menu-btn" onclick="alert('Mission मोड जल्द आ रहा है!')">Mission</button>
        <button class="menu-btn" onclick="alert('Challenge मोड जल्द आ रहा है!')">Challenge</button>
    </div>

    <!-- गेम प्ले स्क्रीन -->
    <div id="gameScreen">
        <div id="msgDisplay">चीट कोड डालें और वाहन मंगाएं!</div>

        <!-- मूविंग वर्ल्ड मैप -->
        <div class="world-container" id="worldContainer" style="position:relative; width:100%; height:100%;">
            <div id="player">🚶‍♂️</div>
            <div id="vehicle">🅿️</div>
        </div>

        <!-- टॉप राइट कंट्रोल्स (कैमरा, टाइम, गन) -->
        <div class="ui-top-right">
            <div class="hud-btn" onclick="alert('कैमरा एंगल बदला गया')">📷</div>
            <div class="hud-btn" onclick="alert('वेपन मेनू खुला')">🔫</div>
            <div class="hud-btn" onclick="location.reload()" title="होम">🏠</div>
        </div>

        <!-- बाएँ तरफ चलने के बटन -->
        <div class="move-controls">
            <div class="dir-btn" ontouchstart="moveWorld(1)" onmousedown="moveWorld(1)">◀</div>
            <div class="dir-btn" ontouchstart="moveWorld(-1)" onmousedown="moveWorld(-1)">▶</div>
        </div>

        <!-- चीट कोड इनपुट पैनल -->
        <div class="cheat-box">
            <input type="number" id="cheatCodeInput" placeholder="कोड (1111)">
            <button onclick="spawnCheatVehicle()">मंगाएं</button>
        </div>
    </div>

    <script>
        function startGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
        }

        let mapPos = 0;
        function moveWorld(direction) {
            mapPos += direction * 40;
            if (mapPos > 0) mapPos = 0;
            if (mapPos < -500) mapPos = -500;
            document.getElementById('worldContainer').style.transform = `translateX(${mapPos}px)`;
        }

        function spawnCheatVehicle() {
            const code = document.getElementById('cheatCodeInput').value.trim();
            const vehicle = document.getElementById('vehicle');
            const player = document.getElementById('player');
            const msg = document.getElementById('msgDisplay');

            vehicle.style.transform = 'scale(0.2)';

            setTimeout(() => {
                if (code === '1111') {
                    vehicle.innerText = '🏎️';
                    player.innerText = '😎';
                    msg.innerText = "सफलता! सुपर कार आ गई है!";
                } else if (code === '2222') {
                    vehicle.innerText = '🏍️';
                    player.innerText = '🏍️';
                    msg.innerText = "सफलता! भारी बाइक आ गई है!";
                } else if (code === '3333') {
                    vehicle.innerText = '🚓';
                    player.innerText = '👮‍♂️';
                    msg.innerText = "सफलता! पुलिस कार आ गई है!";
                } else if (code === '4444') {
                    vehicle.innerText = '🚁';
                    player.innerText = '🎖️';
                    msg.innerText = "सफलता! हेलीकॉप्टर आ गया है!";
                } else {
                    vehicle.innerText = '❌';
                    msg.innerText = "गलत चीट कोड! (जैसे: 1111 डालें)";
                }
                vehicle.style.transform = 'scale(1)';
            }, 200);
        }
    </script>

</body>
</html>
