<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jungle Run 3D - Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #050d0a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        #game { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* HUD UI */
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 2; }
        .stat { background: rgba(10, 30, 22, 0.75); backdrop-filter: blur(5px); border: 1.5px solid rgba(255, 215, 0, 0.4); border-radius: 12px; padding: 8px 16px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #a0d8b6; display: block; }
        .stat b { color: #ffd700; font-size: 20px; font-weight: 800; }
        
        /* Control Overlay Instructions */
        #swipe-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); border-radius: 20px; padding: 8px 20px; font-size: 13px; letter-spacing: 0.5px; color: #e0f2fe; pointer-events: none; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Start/Pause/Game Over Overlay */
        #overlay { position: absolute; inset: 0; background: rgba(5, 15, 10, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
        .panel { width: min(380px, 90%); background: linear-gradient(160deg, #163e2e, #0d1f18); border: 2px solid #ffd700; border-radius: 24px; padding: 28px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .panel h1 { font-size: 28px; color: #ffd700; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .panel p { font-size: 14px; line-height: 1.6; color: #d1e7dd; margin-bottom: 20px; }
        .panel .score-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; margin: 15px 0; border: 1px solid rgba(255,215,0,0.2); }
        .panel button { width: 100%; height: 52px; background: linear-gradient(180deg, #28a745, #1e7e34); border: none; border-radius: 14px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(40,167,69,0.4); transition: transform 0.1s; }
        .panel button:active { transform: scale(0.98); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game">
    <div id="hud">
        <div class="stat"><span>COINS</span><b id="coins">0</b></div>
        <div class="stat"><span>SCORE</span><b id="score">0</b></div>
        <div class="stat"><span>MULTIPLIER</span><b id="speed">1.0x</b></div>
    </div>
    
    <div id="swipe-hint">📱 स्वाइप करें: ⬅️ ➡️ लेन बदलना | ⬆️ कूदना | ⬇️ झुकना</div>

    <div id="overlay">
        <div class="panel">
            <h1 id="title">🌴 JUNGLE RUN 3D</h1>
            <p id="message">जंगल के प्राचीन रास्ते पर भागें, प्राचीन सिक्के इकट्ठा करें और बाधाओं से बचें!</p>
            <div id="score-details" class="hidden score-box"></div>
            <button id="start-btn">▶ खेल शुरू करें</button>
        </div>
    </div>
</div>

<!-- Three.js Engine Import -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a382b);
scene.fog = new THREE.FogExp2(0x1a382b, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("game").prepend(renderer.domElement);

// --- Lighting ---
const ambientLight = new THREE.HemisphereLight(0xffffff, 0x081c15, 1.2);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xfffaed, 2.0);
sun.position.set(-20, 40, -10);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 150;
const d = 25;
sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
scene.add(sun);

// --- Materials ---
const matGround = new THREE.MeshStandardMaterial({ color: 0x112e20, roughness: 0.9 });
const matPath = new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.8 }); // मिट्टी/लकड़ी का प्राचीन रास्ता
const matWood = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.7 });
const matLeaves = new THREE.MeshStandardMaterial({ color: 0x1e5c33, roughness: 0.6 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
const matHero = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });
const matSkin = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
const matRed = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });

// --- Environment Generation ---
const trackWidth = 7;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 600), matGround);
ground.rotation.x = -Math.PI / 2;
ground.position.z = 200;
ground.receiveShadow = true;
scene.add(ground);

const path = new THREE.Mesh(new THREE.PlaneGeometry(trackWidth, 600), matPath);
path.rotation.x = -Math.PI / 2;
path.position.y = 0.01;
path.position.z = 200;
path.receiveShadow = true;
scene.add(path);

// Side Trees & Ruins
const sceneryObjects = [];
function createTree(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 8), matWood);
    trunk.position.y = 2;
    trunk.castShadow = true;
    group.add(trunk);

    const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(2), matLeaves);
    foliage.position.y = 4.5;
    foliage.castShadow = true;
    group.add(foliage);

    group.position.set(x, 0, z);
    scene.add(group);
    sceneryObjects.push(group);
}

for (let z = -50; z < 350; z += 12) {
    createTree(-6 - Math.random() * 8, z);
    createTree(6 + Math.random() * 8, z + 4);
}

// --- Player (Hero) ---
const hero = new THREE.Group();
scene.add(hero);

// Hero Body Parts
const bodyGroup = new THREE.Group();
hero.add(bodyGroup);

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.4), matHero);
torso.position.y = 1.6;
torso.castShadow = true;
bodyGroup.add(torso);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), matSkin);
head.position.y = 2.4;
head.castShadow = true;
bodyGroup.add(head);

// Limbs
const createLimb = (w, h, d, mat, x, y) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, 0);
    mesh.castShadow = true;
    return mesh;
};

const armL = createLimb(0.2, 0.8, 0.2, matSkin, -0.5, 1.7);
const armR = createLimb(0.2, 0.8, 0.2, matSkin, 0.5, 1.7);
const legL = createLimb(0.25, 0.9, 0.25, matRed, -0.2, 0.7);
const legR = createLimb(0.25, 0.9, 0.25, matRed, 0.2, 0.7);

bodyGroup.add(armL, armR, legL, legR);

// --- Game Logic Variables ---
const lanes = [-2.2, 0, 2.2];
let currentLane = 1;
let targetX = lanes[currentLane];

let speed = 16;
let score = 0;
let coinsCollected = 0;
let isRunning = false;
let isPaused = false;
let isGameOver = false;

let isJumping = false;
let jumpVelocity = 0;
const gravity = -38;

let isSliding = false;
let slideTimer = 0;

const obstacles = [];
const coins = [];
let spawnTimer = 0;

// --- Obstacle & Coin Spawners ---
function spawnObstacle(z) {
    const laneIdx = Math.floor(Math.random() * 3);
    const type = Math.random() > 0.5 ? 'LOG' : 'HURDLE';
    const group = new THREE.Group();

    if (type === 'LOG') {
        // Jump over
        const log = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2.2, 12), matWood);
        log.rotation.z = Math.PI / 2;
        log.position.y = 0.5;
        log.castShadow = true;
        group.add(log);
    } else {
        // Slide under
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 0.4), matWood);
        topBar.position.y = 1.8;
        topBar.castShadow = true;

        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.8), matWood);
        p1.position.set(-1, 0.9, 0);
        const p2 = p1.clone();
        p2.position.x = 1;

        group.add(topBar, p1, p2);
    }

    group.position.set(lanes[laneIdx], 0, z);
    group.userData = { type, lane: laneIdx, hit: false };
    scene.add(group);
    obstacles.push(group);
}

function spawnCoins(z) {
    const laneIdx = Math.floor(Math.random() * 3);
    for (let i = 0; i < 4; i++) {
        const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16), matGold);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lanes[laneIdx], 1.2, z + (i * 2.5));
        coin.castShadow = true;
        scene.add(coin);
        coins.push(coin);
    }
}

// --- Swipe Controls (Mobile + Desktop Gestures) ---
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', (e) => {
    if (!isRunning || isPaused) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) {
            if (dx > 0 && currentLane < 2) currentLane++;
            else if (dx < 0 && currentLane > 0) currentLane--;
        }
    } else {
        if (Math.abs(dy) > 30) {
            if (dy < 0) triggerJump();
            else triggerSlide();
        }
    }
}, { passive: true });

// Keyboard Controls Fallback
window.addEventListener('keydown', (e) => {
    if (!isRunning || isPaused) return;
    if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
    if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
    if (e.key === 'ArrowUp' || e.key === 'w') triggerJump();
    if (e.key === 'ArrowDown' || e.key === 's') triggerSlide();
});

function triggerJump() {
    if (!isJumping && !isSliding) {
        isJumping = true;
        jumpVelocity = 12;
    }
}

function triggerSlide() {
    if (!isSliding && !isJumping) {
        isSliding = true;
        slideTimer = 0.6; // Seconds
    }
}

// --- Game Loop & Physics ---
let clock = new THREE.Clock();

function resetGame() {
    // Clear elements
    obstacles.forEach(o => scene.remove(o));
    coins.forEach(c => scene.remove(c));
    obstacles.length = 0;
    coins.length = 0;

    currentLane = 1;
    hero.position.set(0, 0, 0);
    speed = 16;
    score = 0;
    coinsCollected = 0;
    
    isRunning = true;
    isPaused = false;
    isGameOver = false;

    document.getElementById("overlay").classList.add("hidden");
}

function gameOver() {
    isRunning = false;
    isGameOver = true;

    document.getElementById("title").innerText = "💥 GAME OVER";
    document.getElementById("message").innerText = "आप जंगल के खतरों से बच नहीं पाए!";
    
    const details = document.getElementById("score-details");
    details.classList.remove("hidden");
    details.innerHTML = `कुल स्कोर: <b>${Math.floor(score)}</b><br>इकट्ठे किए गए सिक्के: <b>${coinsCollected}</b>`;
    
    document.getElementById("start-btn").innerText = "🔄 फिर से खेलें";
    document.getElementById("overlay").classList.remove("hidden");
}

function update() {
    const delta = clock.getDelta();

    if (!isRunning || isPaused) return;

    // Increase speed slowly
    speed += delta * 0.15;
    score += delta * speed;

    // UI Updates
    document.getElementById("score").innerText = Math.floor(score);
    document.getElementById("coins").innerText = coinsCollected;
    document.getElementById("speed").innerText = (speed / 16).toFixed(1) + "x";

    // Smooth Lane Switching
    targetX = lanes[currentLane];
    hero.position.x += (targetX - hero.position.x) * 15 * delta;

    // Jump Physics
    if (isJumping) {
        hero.position.y += jumpVelocity * delta;
        jumpVelocity += gravity * delta;
        if (hero.position.y <= 0) {
            hero.position.y = 0;
            isJumping = false;
        }
    }

    // Slide Mechanics
    if (isSliding) {
        slideTimer -= delta;
        bodyGroup.scale.set(1, 0.5, 1);
        if (slideTimer <= 0) {
            bodyGroup.scale.set(1, 1, 1);
            isSliding = false;
        }
    }

    // Character Running Animation
    const animTime = clock.getElapsedTime() * speed * 0.8;
    if (!isJumping && !isSliding) {
        legL.rotation.x = Math.sin(animTime) * 0.8;
        legR.rotation.x = -Math.sin(animTime) * 0.8;
        armL.rotation.x = -Math.sin(animTime) * 0.8;
        armR.rotation.x = Math.sin(animTime) * 0.8;
    }

    // Spawners Logic
    spawnTimer += delta * speed;
    if (spawnTimer > 22) {
        spawnTimer = 0;
        if (Math.random() > 0.3) spawnObstacle(120);
        if (Math.random() > 0.4) spawnCoins(100);
    }

    // Move Environment Elements
    sceneryObjects.forEach(obj => {
        obj.position.z -= speed * delta;
        if (obj.position.z < -20) obj.position.z += 400;
    });

    // Handle Obstacles & Collisions
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z -= speed * delta;

        // Collision Check
        if (Math.abs(obs.position.z - hero.position.z) < 0.8 && obs.userData.lane === currentLane) {
            if (obs.userData.type === 'LOG' && hero.position.y < 0.8) {
                gameOver();
            } else if (obs.userData.type === 'HURDLE' && !isSliding) {
                gameOver();
            }
        }

        if (obs.position.z < -10) {
            scene.remove(obs);
            obstacles.splice(i, 1);
        }
    }

    // Handle Coins
    for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z -= speed * delta;
        coin.rotation.z += delta * 5;

        // Pickup Check
        if (Math.abs(coin.position.z - hero.position.z) < 1.0 && Math.abs(coin.position.x - hero.position.x) < 0.8 && hero.position.y < 1.5) {
            coinsCollected++;
            scene.remove(coin);
            coins.splice(i, 1);
        } else if (coin.position.z < -10) {
            scene.remove(coin);
            coins.splice(i, 1);
        }
    }

    // Smooth Camera Follow
    camera.position.x = hero.position.x * 0.3;
    camera.position.y = 4.5 + hero.position.y * 0.2;
    camera.position.z = hero.position.z - 7;
    camera.lookAt(hero.position.x * 0.2, 1.8, hero.position.z + 10);
}

// --- Render Loop ---
function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
}

document.getElementById("start-btn").onclick = resetGame;

// Handle Window Resizing
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
