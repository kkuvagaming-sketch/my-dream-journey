<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>नमस्ते! - खेलें मज़ेदार गेम</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-msg {
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 10px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            height: 220px;
            background: #222;
            border-bottom: 4px solid #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        #dino {
            position: absolute;
            bottom: 0;
            left: 40px;
            font-size: 40px;
            line-height: 40px;
            transform: scaleX(-1); /* डायनासोर को सीधी दिशा में करने के लिए */
        }

        #obstacle {
            position: absolute;
            bottom: 0;
            left: 600px;
            font-size: 35px;
            line-height: 35px;
        }

        .score-board {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }

        #gameOverText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
            color: #ff4757;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 10;
            text-align: center;
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body onclick="jump()">

    <div class="welcome-msg">नमस्ते! 🙏 वेबसाइट पर आपका स्वागत है, तब तक यह गेम खेलें!</div>

    <div class="game-container" id="gameArea">
        <div class="score-board">स्कोर: <span id="score">0</span></div>
        <div id="dino">🦖</div>
        <div id="obstacle">🌵</div>
        <div id="gameOverText">गेम ओवर!<br><span style="font-size: 14px; color: #fff;">पुनः खेलने के लिए टैप करें</span></div>
    </div>

    <div class="instructions">स्क्रीन पर कहीं भी टैप करें (कूदने के लिए)!</div>

    <script>
        const dino = document.getElementById("dino");
        const obstacle = document.getElementById("obstacle");
        const scoreDisplay = document.getElementById("score");
        const gameOverText = document.getElementById("gameOverText");

        let isJumping = false;
        let isGameOver = false;
        let score = 0;

        function jump() {
            if (isGameOver) {
                // गेम रीसेट करें
                isGameOver = false;
                score = 0;
                scoreDisplay.innerText = score;
                gameOverText.style.display = "none";
                obstaclePos = 600;
                return;
            }

            if (isJumping) return;
            isJumping = true;
            
            let jumpHeight = 0;
            let upInterval = setInterval(() => {
                if (jumpHeight >= 100) {
                    clearInterval(upInterval);
                    let downInterval = setInterval(() => {
                        if (jumpHeight <= 0) {
                            clearInterval(downInterval);
                            isJumping = false;
                        }
                        jumpHeight -= 10;
                        dino.style.bottom = jumpHeight + "px";
                    }, 20);
                }
                jumpHeight += 10;
                dino.style.bottom = jumpHeight + "px";
            }, 20);
        }

        let obstaclePos = 600;
        let gameInterval = setInterval(() => {
            if (!isGameOver) {
                obstaclePos -= 7;
                if (obstaclePos < -30) {
                    obstaclePos = 600;
                    score += 10;
                    scoreDisplay.innerText = score;
                }
                obstacle.style.left = obstaclePos + "px";

                let dinoBottom = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
                if (obstaclePos > 30 && obstaclePos < 70 && dinoBottom <= 30) {
                    isGameOver = true;
                    gameOverText.style.display = "block";
                }
            }
        }, 30);
    </script>

</body>
</html>
