 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Cheat Code Game with Character</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* गेम का मुख्य सीन (आसमान और सड़क) */
        .game-scene {
            position: relative;
            width: 100%;
            height: 55vh;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            border-bottom: 5px solid #444;
            overflow: hidden;
        }
        /* सड़क */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25vh;
            background: #222;
            border-top: 4px dashed #f1c40f;
        }
        /* गेम का कैरेक्टर (खिलाड़ी) */
        #playerCharacter {
            position: absolute;
            bottom: 4vh;
            left: 35%;
            font-size: 55px;
            z-index: 2;
        }
        /* वाहन जो स्क्रीन पर दिखेगा */
        #vehicleDisplay {
            position: absolute;
            bottom: 4vh;
            left: 62%;
            transform: translateX(-50%);
            font-size: 65px;
            transition: transform 0.3s ease;
            z-index: 2;
        }
        /* नीचे कंट्रोल पैनल */
        .control-panel {
            background: #1e1e1e;
            height: 45vh;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            border-top: 2px solid #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #fff;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #219653; }
        #message {
            font-size: 14px;
            font-weight: bold;
            height: 20px;
        }
        /* चीट कोड लिस्ट */
        .cheat-list {
            font-size: 12px;
            background: #111;
            padding: 8px 12px;
            border-radius: 5px;
            width: 100%;
            max-width: 400px;
            color: #bbb;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- गेम विजुअल एरिया (कैरेक्टर और वाहन) -->
    <div class="game-scene">
        <div class="road"></div>
        <!-- शानदार इंडियन गेम स्टाइल कैरेक्टर -->
        <div id="playerCharacter">🚶‍♂️</div>
        <div id="vehicleDisplay">🅿️</div>
    </div>

    <!-- चीट कोड और कंट్రోल्स -->
    <div class="control-panel">
        <h3 style="font-size: 16px; color: #f39c12;">🎮 Indian Cheat Code Spawner</h3>
        
        <div class="input-group">
            <input type="number" id="cheatInput" placeholder="कोड लिखें (जैसे: 1111)">
            <button onclick="spawnVehicle()">मंगाएं</button>
        </div>

        <div id="message"></div>

        <div class="cheat-list">
            <span><strong>1111:</strong> सुपर कार</span>
            <span><strong>2222:</strong> बाइक</span>
            <span><strong>3333:</strong> पुलिस</span>
            <span><strong>4444:</strong> हेलीकाप्टर</span>
        </div>
    </div>

    <script>
        function spawnVehicle() {
            const code = document.getElementById('cheatInput').value.trim();
            const display = document.getElementById('vehicleDisplay');
            const character = document.getElementById('playerCharacter');
            const msg = document.getElementById('message');

            display.style.transform = 'translateX(-50%) scale(0.5)';
            
            setTimeout(() => {
                if (code === '1111') {
                    display.innerText = '🏎️';
                    character.innerText = '😎'; // कूल लुक वाला कैरेक्टर गाड़ी के पास
                    msg.style.color = '#2ecc71';
                    msg.innerText = "सफलता! कैरेक्टर के पास सुपर कार आ गई है!";
                } else if (code === '2222') {
                    display.innerText = '🏍️';
                    character.innerText = '🏍️'; // बाइकर लुक
                    msg.style.color = '#2ecc71';
                    msg.innerText = "सफलता! भारी बाइक आ गई है!";
                } else if (code === '3333') {
                    display.innerText = '🚓';
                    character.innerText = '👮‍♂️'; // पुलिस कॉप लुक
                    msg.style.color = '#2ecc71';
                    msg.innerText = "सफलता! पुलिस कार आ गई है!";
                } else if (code === '4444') {
                    display.innerText = '🚁';
                    character.innerText = '🎖️'; 
                    msg.style.color = '#2ecc71';
                    msg.innerText = "सफलता! हेलीकॉप्टर उड़ान भर रहा है!";
                } else {
                    display.innerText = '❌';
                    character.innerText = '❌';
                    msg.style.color = '#e74c3c';
                    msg.innerText = "गलत चीट कोड!";
                }
                display.style.transform = 'translateX(-50%) scale(1)';
            }, 150);
        }
    </script>

</body>
</html>
