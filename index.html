<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indian Cheat Code Open World Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            touch-action: none;
        }

        /* ओपन वर्ल्ड गेम मैप (शहर और सड़क का माहौल) */
        #gameMap {
            position: relative;
            width: 100%;
            height: 60vh;
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            border-bottom: 6px solid #222;
            overflow: hidden;
            cursor: grab;
        }

        #gameMap:active {
            cursor: grabbing;
        }

        /* मैप के अंदर का पूरा सीन जो मूव होगा */
        .world-container {
            position: absolute;
            width: 200%; /* बड़ा ओपन मैप ताकि स्क्रॉल/स्वाइप हो सके */
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 0.1s ease-out;
        }

        /* आसमान और बिल्डिंग्स की बैकग्राउंड लाइन */
        .city-skyline {
            position: absolute;
            bottom: 35vh;
            width: 100%;
            height: 25vh;
            background: repeating-linear-gradient(
                90deg,
                #34495e,
                #34495e 60px,
                #2c3e50 60px,
                #2c3e50 120px
            );
            opacity: 0.6;
        }

        /* चौड़ी मुख्य सड़क (Indian Game Style Road) */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35vh;
            background: #333;
            border-top: 5px solid #555;
            border-bottom: 5px solid #111;
        }

        /* सड़क की बीच की पीली और सफेद धारियां */
        .road-stripe {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                #f1c40f,
                #f1c40f 40px,
                transparent 40px,
                transparent 80px
            );
            transform: translateY(-50%);
        }

        /* गेम का कैरेक्टर */
        #playerCharacter {
            position: absolute;
            bottom: 8vh;
            left: 25%;
            font-size: 60px;
            z-index: 5;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* वाहन डिस्प्ले */
        #vehicleDisplay {
            position: absolute;
            bottom: 8vh;
            left: 35%;
            font-size: 70px;
            z-index: 5;
            transition: all 0.3s ease;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        /* कंट्रोल और यूआई पैनल */
        .control-panel {
            background: #151b22;
            height: 40vh;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            border-top: 3px solid #2ea043;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        .input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            justify-content: center;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #0d1117;
            color: #fff;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background: #2ea043;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:active { background: #238636; }

        #message {
            font-size: 15px;
            font-weight: bold;
            height: 22px;
        }

        /* चीट कोड लिस्ट */
        .cheat-list {
            font-size: 13px;
            background: #0d1117;
            padding: 10px 15px;
            border-radius: 6px;
            width: 100%;
            max-width: 450px;
            color: #8b949e;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #30363d;
        }

        .cheat-list span {
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <!-- ओपन वर्ल्ड मैप एरिया -->
    <div id="gameMap">
        <div class="world-container" id="worldContainer">
            <div class="city-skyline"></div>
            <div class="road">
                <div class="road-stripe"></div>
            </div>
            <!-- कैरेक्टर और वाहन -->
            <div id="playerCharacter">🚶‍♂️</div>
            <div id="vehicleDisplay">🅿️</div>
        </div>
    </div>

    <!-- चीट कोड और कंट్రోल्स पैनल -->
    <div class="control-panel">
        <h3 style="font-size: 17px; color: #58a6ff;">🇮🇳 Indian Cheat Code Open-World</h3>
        
        <div class="input-group">
            <input type="number" id="cheatInput" placeholder="चीट कोड दर्ज करें (जैसे: 1111)">
            <button onclick="spawnVehicle()">मंगाएं</button>
        </div>

        <div id="message"></div>

        <div class="cheat-list">
            <span><strong>1111:</strong> सुपर कार</span>
            <span><strong>2222:</strong> बाइक</span>
            <span><strong>3333:</strong> पुलिस</span>
            <span><strong>4444:</strong> हेलीकॉप्टर</span>
        </div>
    </div>

    <script>
        // मैप को टच करके या माउस से आगे-पीछे (Pan/Swipe) करने का फीचर
        const map = document.getElementById('gameMap');
        const world = document.getElementById('worldContainer');
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        map.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX - currentX;
        });

        map.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX - startX;
            // मैप को बाएँ-दाएँ खिसकाने की सीमा तय करना
            if (currentX > 0) currentX = 0;
            if (currentX < -300) currentX = -300;
            world.style.transform = `translateX(${currentX}px)`;
        });

        map.addEventListener('touchend', () => {
            isDragging = false;
        });

        // माउस के लिए भी सपोर्ट (कंप्यूटर या टचपैड पर चेक करने के लिए)
        map.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
        });
        map.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            if (currentX > 0) currentX = 0;
            if (currentX < -300) currentX = -300;
            world.style.transform = `translateX(${currentX}px)`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });


        // वाहन मंगाने का मुख्य फंक्शन
        function spawnVehicle() {
            const code = document.getElementById('cheatInput').value.trim();
            const display = document.getElementById('vehicleDisplay');
            const character = document.getElementById('playerCharacter');
            const msg = document.getElementById('message');

            display.style.transform = 'scale(0.3)';
            
            setTimeout(() => {
                if (code === '1111') {
                    display.innerText = '🏎️';
                    character.innerText = '😎';
                    msg.style.color = '#3fb950';
                    msg.innerText = "सफलता! शानदार सुपर कार सड़क पर आ गई है!";
                } else if (code === '2222') {
                    display.innerText = '🏍️';
                    character.innerText = '🏍️';
                    msg.style.color = '#3fb950';
                    msg.innerText = "सफलता! भारी बाइक आ गई है!";
                } else if (code === '3333') {
                    display.innerText = '🚓';
                    character.innerText = '👮‍♂️';
                    msg.style.color = '#3fb950';
                    msg.innerText = "सफलता! पुलिस गश्त कार हाज़िर है!";
                } else if (code === '4444') {
                    display.innerText = '🚁';
                    character.innerText = '🎖️';
                    msg.style.color = '#3fb950';
                    msg.innerText = "सफलता! हेलीकॉप्टर उड़ान के लिए तैयार है!";
                } else {
                    display.innerText = '❌';
                    character.innerText = '❌';
                    msg.style.color = '#f85149';
                    msg.innerText = "अमान्य चीट कोड! सही कोड दर्ज करें।";
                }
                display.style.transform = 'scale(1)';
            }, 150);
        }
    </script>

</body>
</html>
